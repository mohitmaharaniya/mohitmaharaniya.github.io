<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohit Maharaniya</title>
<meta name="description" content="Mohit Maharaniya - OT Technician in Jaipur">
<style>
:root{--bg1:#f4f7fb;--bg2:#dfe9f6;--card:#ffffff;--text:#101828;--muted:#5b6678;--accent:#2563eb;--line:#e3e8f0;--btn:#f6f8fc;--shadow:0 20px 50px rgba(30,60,120,.15)}
@media (prefers-color-scheme:dark){:root{--bg1:#0b1220;--bg2:#141f38;--card:#121a2b;--text:#f1f5fb;--muted:#9aa7bd;--accent:#6ea0ff;--line:#243049;--btn:#18223a;--shadow:0 20px 50px rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;justify-content:center;align-items:flex-start;padding:48px 18px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:34px 24px 28px;text-align:center}
.photo{width:128px;height:128px;border-radius:50%;margin:0 auto 18px;border:4px solid var(--accent);overflow:hidden;background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--accent)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:28px;font-weight:700;letter-spacing:.2px}
.job{margin-top:8px;font-size:16px;color:var(--muted)}
.job b{color:var(--accent);font-weight:600}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.links{display:flex;flex-direction:column;gap:12px}
.links a{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 16px;border-radius:14px;background:var(--btn);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:16px;font-weight:600;transition:.2s}
.links a:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px)}
footer{margin-top:24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="photo" id="photo">
    <img src="Screenshot_20261102-121505_Photos.png" alt="Mohit Maharaniya" onerror="this.remove();document.getElementById('photo').textContent='MM'">
  </div>
  <h1>Mohit Maharaniya</h1>
  <p class="job"><b>OT Technician</b> in Jaipur</p>
  <hr>
  <nav class="links" id="links"></nav>
  <footer>&copy; <span id="yr"></span> Mohit Maharaniya</footer>
</main>

<script>
/* FUTURE ME KUCH ADD KARNA HO TO SIRF YE LIST BADLO.
   Naya link jodne ke liye ek line copy karke label aur url badal do. */
const LINKS = [
  { label: "Instagram", url: "https://www.instagram.com/mr.mm_018" },
  { label: "Facebook",  url: "https://www.facebook.com/share/19dk94aLAt/" },
  { label: "Call Me",   url: "tel:+918741897205" },
  { label: "Email",     url: "mailto:mohitmaharania@gmail.com" }
];

const box = document.getElementById("links");
LINKS.forEach(function(l){
  const a = document.createElement("a");
  a.href = l.url;
  a.textContent = l.label;
  if (l.url.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
  box.appendChild(a);
});
document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
