<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohit Maharaniya | OT Technician in Jaipur</title>
<meta name="description" content="Mohit Maharaniya - OT Technician in Jaipur">
<style>
:root{--bg:#0a1020;--card:#121b30;--text:#f2f5fb;--muted:#9aa8c2;--accent:#5b9bff;--line:#22304d}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(10,16,32,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav b{font-size:16px}
.nav div a{color:var(--muted);text-decoration:none;margin-left:16px;font-size:14px}
.nav div a:hover{color:var(--accent)}
.hero{position:relative;min-height:88vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:60px 20px;background:linear-gradient(135deg,#0a1020,#13264d,#0a1020);background-size:300% 300%;animation:flow 14s ease infinite}
@keyframes flow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.hero .in{position:relative;z-index:2;max-width:560px}
.photo{width:170px;height:170px;border-radius:50%;margin:0 auto 22px;border:4px solid var(--accent);overflow:hidden;box-shadow:0 0 0 8px rgba(91,155,255,.15),0 20px 50px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:var(--accent);background:var(--card)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:clamp(32px,8vw,48px);letter-spacing:.3px}
.job{margin-top:10px;font-size:19px;color:var(--muted)}
.job b{color:var(--accent)}
.cta{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;border-radius:12px;font-weight:600;text-decoration:none;font-size:16px;transition:.2s}
.p{background:var(--accent);color:#06101f}
.s{border:1px solid var(--accent);color:var(--accent)}
.btn:hover{transform:translateY(-3px)}
section.sec{max-width:880px;margin:0 auto;padding:70px 20px}
h2{font-size:28px;margin-bottom:8px}
h2::after{content:"";display:block;width:50px;height:4px;background:var(--accent);border-radius:4px;margin-top:8px}
.lead{margin-top:20px;color:var(--muted);font-size:17px}
.grid{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.vid{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vid iframe,.vid video{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
.vid p{padding:12px 14px;font-weight:600;font-size:15px}
.links{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.links a{display:block;text-align:center;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;transition:.2s}
.links a:hover{background:var(--accent);color:#06101f;transform:translateY(-3px)}
footer{text-align:center;padding:28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(24px);transition:.7s}
.rv.show{opacity:1;transform:none}
</style>
</head>
<body>
<header class="nav">
  <b>Mohit Maharaniya</b>
  <div><a href="#about">About</a><a href="#videos" id="navv">Videos</a><a href="#contact">Contact</a></div>
</header>

<section class="hero">
  <video class="bgv" id="bgv" autoplay muted loop playsinline><source id="bgsrc" src="bg.mp4" type="video/mp4"></video>
  <div class="in">
    <div class="photo" id="photo"><img id="pimg" alt="Mohit Maharaniya"></div>
    <h1>Mohit Maharaniya</h1>
    <p class="job"><b>OT Technician</b> in Jaipur</p>
    <div class="cta">
      <a class="btn p" href="#contact">Contact Me</a>
      <a class="btn s" href="#about">About Me</a>
    </div>
  </div>
</section>

<section class="sec rv" id="about">
  <h2>About</h2>
  <p class="lead">I am an Operation Theatre Technician based in Jaipur, committed to patient safety, precision and teamwork in the operation theatre.</p>
</section>

<section class="sec rv" id="videos" style="display:none">
  <h2>Videos</h2>
  <div class="grid" id="vgrid"></div>
</section>

<section class="sec rv" id="contact">
  <h2>Connect With Me</h2>
  <div class="links" id="links"></div>
</section>

<footer>&copy; <span id="yr"></span> Mohit Maharaniya</footer>

<script>
/* ===== YAHAN SE SAB KUCH BADAL SAKTE HO ===== */
const PHOTO = "Screenshot_20261102-121505_Photos.png";

const LINKS = [
  { label: "Instagram", url: "https://www.instagram.com/mr.mm_018" },
  { label: "Facebook",  url: "https://www.facebook.com/share/19dk94aLAt/" },
  { label: "Call Me",   url: "tel:+918741897205" },
  { label: "Email",     url: "mailto:mohitmaharania@gmail.com" }
];

/* VIDEOS: neeche example hataakar apni video jodo.
   YouTube: { type: "youtube", id: "VIDEO_ID", title: "Naam" }
   Apni file: { type: "file", src: "video1.mp4", title: "Naam" } */
const VIDEOS = [
  // { type: "youtube", id: "VIDEO_ID", title: "My Video" },
  // { type: "file", src: "video1.mp4", title: "My Work" }
];
/* ============================================ */

const img = document.getElementById("pimg");
img.src = PHOTO;
img.onerror = function(){ img.remove(); document.getElementById("photo").textContent = "MM"; };

document.getElementById("bgsrc").addEventListener("error", function(){
  const v = document.getElementById("bgv"); if (v) v.remove();
});

const box = document.getElementById("links");
LINKS.forEach(function(l){
  const a = document.createElement("a");
  a.href = l.url; a.textContent = l.label;
  if (l.url.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
  box.appendChild(a);
});

if (VIDEOS.length) {
  document.getElementById("videos").style.display = "block";
  const g = document.getElementById("vgrid");
  VIDEOS.forEach(function(v){
    const d = document.createElement("div"); d.className = "vid";
    if (v.type === "youtube") {
      d.innerHTML = '<iframe src="https://www.youtube.com/embed/' + v.id + '" allowfullscreen loading="lazy"></iframe>';
    } else {
      d.innerHTML = '<video controls playsinline preload="metadata" src="' + v.src + '"></video>';
    }
    const p = document.createElement("p"); p.textContent = v.title || "";
    d.appendChild(p); g.appendChild(d);
  });
} else {
  document.getElementById("navv").style.display = "none";
}

const io = new IntersectionObserver(function(es){
  es.forEach(function(e){ if (e.isIntersecting) e.target.classList.add("show"); });
}, { threshold: .12 });
document.querySelectorAll(".rv").forEach(function(el){ io.observe(el); });
document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
